<title>LE SALÉ LINGUISTIQUE</title>
<style>
/* ============================================================
   TOKENS — palette « royaume semé de sel »
   Le monde est minéral et délavé. La couleur revient avec les alliés.
   ============================================================ */
:root{
  --ink:#0E141C;        /* le vide, le fond */
  --brine:#1B2430;      /* panneaux */
  --brine-2:#243040;    /* panneaux élevés */
  --salt:#E8E4DC;       /* croûte de sel, texte principal */
  --salt-dim:#8D9099;   /* texte secondaire */
  --wax:#A33A32;        /* les ordres. le sceau. */
  --wax-lit:#D65A4E;
  --gilt:#C89B4A;       /* ce qui est restauré */
  --verdigris:#4E8F7C;  /* ce qui est vivant */
  --bruise:#6B4A7A;     /* l'ennemi */

  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--salt);
  font-family:var(--sans);overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{width:100%;height:100%}
canvas{display:block;touch-action:none}

/* ---------- couches ---------- */
.layer{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;
  background:var(--ink);padding-top:var(--sat);padding-bottom:var(--sab)}
.layer.on{display:flex}

/* ---------- typographie ---------- */
.decree{font-family:var(--serif);font-size:clamp(26px,8vw,42px);line-height:1;
  letter-spacing:.01em;font-weight:400}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--salt-dim)}
.ledger{font-family:var(--mono);font-size:12px;letter-spacing:.04em}

/* ============================================================
   SIGNATURE — les sceaux.
   JHN ne frappe pas. Il scelle des ordres. Deux par tour.
   ============================================================ */
#seals{display:flex;gap:10px;align-items:center;justify-content:center;
  padding:10px 0 4px}
.seal{width:34px;height:34px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 30%,var(--wax-lit),var(--wax) 62%,#6E241F);
  box-shadow:0 2px 0 #5A1D19, inset 0 -2px 3px rgba(0,0,0,.45);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),opacity .18s,filter .18s}
.seal::after{content:'';position:absolute;inset:8px;border-radius:50%;
  border:1.5px solid rgba(255,225,205,.32)}
.seal.spent{transform:scale(.72) rotate(-14deg);opacity:.2;filter:grayscale(1)}
.seal.gain{animation:sealIn .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes sealIn{from{transform:scale(0) rotate(90deg)}to{transform:none}}


/* ============================================================
   CHAMP DE BATAILLE — cadrage Pokémon : les alliés vus de dos,
   l'ennemi de face. Les sprites sortent directement de chars.png.
   ============================================================ */
#combat{background:
  radial-gradient(130% 62% at 50% 4%, #34405400 0%, transparent 70%),
  linear-gradient(#242E3C 0%, #1A2330 46%, #121A24 47%, #0E141C 100%)}

.field{flex:1;position:relative;min-height:0;display:flex;flex-direction:column;
  justify-content:space-between;padding:6px 12px 4px;overflow:hidden}
.field::after{                       /* ligne d'horizon : sol salé */
  content:'';position:absolute;left:0;right:0;top:47%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,228,220,.16),transparent)}

.foe-zone{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding-top:2px;position:relative;z-index:2}
#foeArt{width:150px;height:150px;flex:none;image-rendering:pixelated;
  background-repeat:no-repeat;background-size:600px 900px;
  animation:bossIdle 1.1s steps(1) infinite,breathe 3.4s ease-in-out infinite;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.6))}
@keyframes bossIdle{
  0%,24.9%  {background-position-x:0}
  25%,49.9% {background-position-x:-150px}
  50%,74.9% {background-position-x:-300px}
  75%,100%  {background-position-x:-450px}}
@keyframes breathe{50%{transform:translateY(-4px)}}

/* ligne d'alliés, vus de dos */
.ally-line{display:flex;justify-content:space-around;align-items:flex-end;
  gap:6px;padding-bottom:6px;position:relative;z-index:2}
.unit{display:flex;flex-direction:column;align-items:center;gap:3px;
  width:33%;transition:opacity .3s}
.unit .sp{width:88px;height:88px;image-rendering:pixelated;
  background-repeat:no-repeat;background-size:2112px 352px;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.unit .un{font-family:var(--serif);font-size:11.5px;line-height:1.1;text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .uh{font-family:var(--mono);font-size:9px;color:var(--salt-dim)}
.unit.active .un{color:var(--gilt)}
.unit.active .sp{filter:drop-shadow(0 0 9px rgba(200,155,74,.55)) drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.unit.ko{opacity:.28}
.unit.ko .sp{filter:grayscale(1) brightness(.5);transform:rotate(-12deg)}
.unit.guarding .sp{filter:drop-shadow(0 0 10px rgba(78,143,124,.8))}

/* ---------- animations de combat ---------- */
@keyframes lunge   {0%,100%{transform:translateY(0)} 35%{transform:translateY(-30px) scale(1.1)}}
@keyframes slam    {0%,100%{transform:translateY(0)} 35%{transform:translateY(26px) scale(1.06)}}
@keyframes hitShake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
                    45%{transform:translateX(7px)} 70%{transform:translateX(-4px)}}
@keyframes whiteOut{0%,100%{filter:none} 30%,60%{filter:brightness(4) saturate(0)}}
@keyframes redOut  {0%,100%{filter:none} 30%,60%{filter:brightness(2.4) sepia(1) hue-rotate(-35deg) saturate(7)}}
@keyframes greenUp {0%,100%{filter:none} 40%{filter:brightness(1.7) hue-rotate(70deg) saturate(2)}}
@keyframes windUp  {0%,100%{transform:scale(1)} 50%{transform:scale(1.09)}}

.anim-lunge  {animation:lunge .34s ease-out}
.anim-slam   {animation:slam .38s ease-out}
.anim-hit    {animation:hitShake .34s ease-out, redOut .34s ease-out}
.anim-foehit {animation:hitShake .3s ease-out, whiteOut .3s ease-out}
.anim-heal   {animation:greenUp .6s ease-out}
.anim-wind   {animation:windUp .7s ease-in-out infinite}

/* chiffres de dégâts */
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.dmg{position:absolute;font-family:var(--mono);font-size:20px;font-weight:700;
  text-shadow:0 2px 0 var(--ink),0 0 10px rgba(0,0,0,.9);
  animation:floatDmg 1s cubic-bezier(.2,.8,.3,1) forwards;transform:translateX(-50%)}
.dmg.foe{color:#FFF0E4} .dmg.ally{color:var(--wax-lit)}
.dmg.heal{color:var(--verdigris)} .dmg.miss{color:var(--salt-dim);font-size:14px}
@keyframes floatDmg{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}
  22%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}

/* onde de choc à l'impact */
.ring{position:absolute;border:2px solid var(--salt);border-radius:50%;
  width:20px;height:20px;margin:-10px 0 0 -10px;opacity:.9;
  animation:ringOut .45s ease-out forwards}
@keyframes ringOut{to{width:120px;height:120px;margin:-60px 0 0 -60px;opacity:0}}

/* ============================================================
   FILE DES TOURS — chaque personnage a son tour, visible d'avance.
   Le sceau décide seulement si tu peux te le payer.
   ============================================================ */
#turnbar{display:flex;gap:5px;align-items:center;padding:8px 10px 7px;
  overflow-x:auto;scrollbar-width:none;flex:none;
  border-bottom:1px solid rgba(232,228,220,.08);background:rgba(10,14,20,.5)}
#turnbar::-webkit-scrollbar{display:none}
.slot{flex:none;width:38px;height:38px;border-radius:3px;position:relative;
  border:1px solid rgba(232,228,220,.14);overflow:hidden;
  background:#141C26;transition:transform .25s,border-color .25s,opacity .25s}
.slot .f{position:absolute;inset:0;image-rendering:pixelated;
  background-repeat:no-repeat;background-size:912px 152px;
  background-position-x:-0px}
.slot.foe .f{background-size:152px 228px}
.slot.now{transform:scale(1.16);border-color:var(--gilt);z-index:2}
.slot.now::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--gilt)}
.slot.foe{border-color:rgba(107,74,122,.7)}
.slot.spent{opacity:.25}
.slot.dead{opacity:.18;filter:grayscale(1)}
#turnbar .arrow{flex:none;font-family:var(--mono);font-size:9px;color:#39404A;
  letter-spacing:.1em}

#cbtPhase{padding:2px 12px 0;text-align:center}

/* ---------- combat (base) ---------- */
/* choix de l'equipe : cinq verbes existent, trois descendent sur le terrain */
.pick{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px;margin-bottom:7px;background:var(--brine);border-radius:3px;
  border:1px solid transparent;transition:border-color .15s,background .15s}
.pick.in{border-color:var(--gilt);background:var(--brine-2)}
.pick .av{width:44px;height:44px;flex:none;image-rendering:pixelated;
  background-repeat:no-repeat;background-size:1056px 176px}
.pick .who{font-family:var(--serif);font-size:14px;line-height:1.2}
.pick .vb{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--salt-dim);margin-top:3px}
.pick .slot{margin-left:auto;font-family:var(--mono);font-size:9px;
  letter-spacing:.12em;color:var(--gilt);flex:none}

.foe-name{font-family:var(--serif);font-size:clamp(22px,7vw,34px);color:var(--bruise);
  filter:brightness(1.7);letter-spacing:.02em}
.bar{width:min(320px,82vw);height:7px;background:#0B1017;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--bruise);
  transition:width .45s cubic-bezier(.3,0,.2,1)}
.bar.small{width:100%;height:4px}
.bar.small>i{background:var(--verdigris)}

/* la carte de télégraphe : ce que le boss prépare */
.tele{border:1px solid rgba(232,228,220,.16);background:rgba(27,36,48,.8);
  border-radius:3px;padding:10px 16px;text-align:center;min-width:190px;
  backdrop-filter:blur(6px)}
.tele .act{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
.tele .cnt{font-family:var(--mono);font-size:11px;color:var(--wax-lit);
  letter-spacing:.14em;margin-top:3px}
.tele.hidden .act{filter:blur(7px);opacity:.55}
.tele.hidden .cnt{visibility:hidden}
.tele.imminent{border-color:var(--wax);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(163,58,50,.22)}}

/* ---------- alliés ---------- */
/* ---------- verbes ---------- */
.verbs{display:flex;flex-wrap:wrap;gap:7px;padding:10px 12px;min-height:72px;
  align-content:flex-start;justify-content:center}
.verb{border:1px solid rgba(232,228,220,.2);border-radius:2px;padding:9px 14px;
  font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  transition:background .15s,border-color .15s}
.verb:active{background:var(--wax);border-color:var(--wax)}
.verb[disabled]{opacity:.25}
.verb .cost{color:var(--wax-lit);margin-left:7px}

/* ---------- journal ---------- */
#log{height:52px;flex:none;overflow:hidden;padding:0 14px;display:flex;flex-direction:column;
  justify-content:flex-end;gap:2px}
#log p{font-size:12.5px;color:var(--salt-dim);line-height:1.35;
  animation:logIn .25s ease-out}
#log p:last-child{color:var(--salt)}
@keyframes logIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.cbt-foot{border-top:1px solid rgba(232,228,220,.09);background:rgba(14,20,28,.92)}
#endturn{width:100%;padding:15px;font-family:var(--mono);font-size:12px;
  letter-spacing:.2em;text-transform:uppercase;background:var(--brine);
  border-top:1px solid rgba(232,228,220,.09)}
#endturn:active{background:var(--wax)}

/* ---------- dialogue ---------- */
#dialog{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
  background:linear-gradient(transparent,var(--ink) 22%);
  padding:44px 16px calc(16px + var(--sab))}
#dialog.on{display:block}
.dbox{background:var(--brine);border:1px solid rgba(232,228,220,.14);border-radius:3px;
  padding:14px 16px;max-width:640px;margin:0 auto}
.dwho{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gilt);margin-bottom:7px}
.dtxt{font-size:15px;line-height:1.5}
.dhint{font-family:var(--mono);font-size:9.5px;color:var(--salt-dim);
  text-align:right;margin-top:9px;letter-spacing:.12em}

/* ---------- HUD monde ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(var(--sat) + 10px) 14px 0;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud .region{font-family:var(--serif);font-size:15px;text-shadow:0 1px 4px var(--ink)}
#hud .year{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gilt)}
#menuBtn{pointer-events:auto;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  border:1px solid rgba(232,228,220,.25);border-radius:2px;padding:7px 11px;
  background:rgba(14,20,28,.75)}

/* ---------- manette tactile ---------- */
#stick{position:fixed;z-index:6;width:112px;height:112px;border-radius:50%;
  border:1px solid rgba(232,228,220,.16);display:none;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;
  border-radius:50%;background:rgba(232,228,220,.2);
  border:1px solid rgba(232,228,220,.35)}
#actBtn{position:fixed;right:22px;bottom:calc(30px + var(--sab));z-index:6;
  width:72px;height:72px;border-radius:50%;border:1px solid rgba(200,155,74,.5);
  background:rgba(27,36,48,.85);font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;color:var(--gilt);display:none}
#actBtn.on{display:block}
#actBtn:active{background:var(--gilt);color:var(--ink)}

/* ---------- menu / royaume / registre ---------- */
.sheet{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 30px}
.tabs{display:flex;border-bottom:1px solid rgba(232,228,220,.12)}
.tab{flex:1;padding:15px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--salt-dim);border-bottom:2px solid transparent}
.tab.on{color:var(--salt);border-bottom-color:var(--gilt)}
.sect{margin-bottom:26px}
.sect h3{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gilt);margin-bottom:11px;padding-bottom:7px;
  border-bottom:1px solid rgba(200,155,74,.22)}

/* le royaume : chaque allié ramené rallume un bâtiment */
#realm{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px}
.brick{aspect-ratio:1;border:1px solid rgba(232,228,220,.1);border-radius:2px;
  background:#141B24;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:8px;color:#39404A;text-align:center;padding:3px;
  line-height:1.15;overflow:hidden;transition:all .5s}
.brick.up{background:linear-gradient(160deg,rgba(200,155,74,.2),rgba(200,155,74,.05));
  border-color:rgba(200,155,74,.55);color:var(--gilt);
  box-shadow:0 0 14px rgba(200,155,74,.16)}

/* le registre : les 36 entrées, par année */
.entry{display:flex;align-items:baseline;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(232,228,220,.06)}
.entry .n{font-family:var(--mono);font-size:9px;color:#39404A;width:22px;flex:none}
.entry .t{font-size:14px;flex:1}
.entry .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;padding:2px 6px;border-radius:2px;flex:none}
.entry.locked .t{color:#39404A}
.entry.locked .t::after{content:' ····'}
.k.play{background:rgba(78,143,124,.18);color:var(--verdigris)}
.k.equip{background:rgba(200,155,74,.16);color:var(--gilt)}
.k.key{background:rgba(163,58,50,.2);color:var(--wax-lit)}

.big{width:100%;padding:15px;margin-top:8px;font-family:var(--mono);font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(232,228,220,.22);
  border-radius:2px}
.big:active{background:var(--brine-2)}
.big.warn{border-color:rgba(163,58,50,.5);color:var(--wax-lit)}

/* ---------- titre ---------- */
#title{justify-content:center;align-items:center;text-align:center;padding:26px;
  background:radial-gradient(100% 70% at 50% 40%,#1E2836,var(--ink) 72%)}
#title .crown{font-size:40px;color:var(--gilt);margin-bottom:20px;
  animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
#title h1{font-family:var(--serif);font-size:clamp(30px,10vw,52px);line-height:.98;
  letter-spacing:.01em;margin-bottom:12px}
#title .sub{max-width:330px;font-size:13.5px;color:var(--salt-dim);line-height:1.55;
  margin-bottom:34px}

/* ---------- fondu ---------- */
#fade{position:fixed;inset:0;z-index:50;background:var(--ink);pointer-events:none;
  opacity:0;transition:opacity .35s}
#fade.on{opacity:1}

#boot{position:fixed;inset:0;z-index:60;display:flex;align-items:center;
  justify-content:center;background:var(--ink);text-align:center;padding:26px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
</style>
</head>

   --------------------------------------------------------------------------- */
const S = {
  started:false,
  region:0,
  x:9, y:41,            // position en tuiles, monde absolu (Le Trône Vide)
  owned:{},             // id -> true
  bossesDone:{},        // id -> true
  level:1,
  team:[],              // les trois alliés sur le terrain
  seals:2,              // ordres par tour
  flags:{},
};

const has     = id => !!S.owned[id];
const hasVerb = v  => ROSTER.some(e => e.verb === v && S.owned[e.id]);
const ownedCount = () => ROSTER.filter(e => S.owned[e.id] && e.id !== 'jhn').length;

/* Les alliés jouables possédés, tous confondus. */
function playable(){
  return ROSTER.filter(e => e.kind === 'play' && S.owned[e.id]);
}

/* L'équipe qui descend sur le terrain : trois au maximum.
   C'est le vrai choix tactique — cinq verbes existent, trois partent. */
function party(){
  const own = playable();
  if (!Array.isArray(S.team)) S.team = [];
  S.team = S.team.filter(id => S.owned[id] && ALLY_KIT[id]).slice(0,3);
  for (const e of own){
    if (S.team.length >= 3) break;
    if (!S.team.includes(e.id)) S.team.push(e.id);
  }
  return S.team.map(id => BY_ID[id]);
}
function toggleTeam(id){
  if (!Array.isArray(S.team)) S.team = [];
  const i = S.team.indexOf(id);
  if (i >= 0){ if (S.team.length > 1) S.team.splice(i,1); }
  else if (S.team.length < 3) S.team.push(id);
  else { S.team.shift(); S.team.push(id); }
}

/* Acquisition d'une entree du registre — SEUL chemin autorise.
   Centralise les trois choses qui doivent toujours aller ensemble :
   marquer la possession, rouvrir les portes que le nouveau verbe debloque,
   et sauvegarder. Les oublier separement etait deja un bug une fois. */
async function grant(id){
  if (!id || S.owned[id]) return false;
  S.owned[id] = true;
  if (UI.scene && UI.scene.refreshGates) UI.scene.refreshGates();
  await saveGame();
  return true;
}

/* ---------------------------------------------------------------------------
   SAUVEGARDE — adaptateur à trois niveaux.
   window.storage (aperçu Claude) → localStorage (GitHub Pages) → mémoire.
   Le même fichier marche des deux côtés sans modification.
   --------------------------------------------------------------------------- */
const KEY = 'sale:save';
let memSave = null;

async function saveGame(){
  const blob = JSON.stringify(S);
  memSave = blob;
  try { if (window.storage) { await window.storage.set(KEY, blob); return; } } catch(e){}
  try { localStorage.setItem(KEY, blob); } catch(e){}
}
async function loadGame(){
  let blob = null;
  try { if (window.storage) { const r = await window.storage.get(KEY); blob = r && r.value; } } catch(e){}
  if (!blob) { try { blob = localStorage.getItem(KEY); } catch(e){} }
  if (!blob) blob = memSave;
  if (!blob) return false;
  try { Object.assign(S, JSON.parse(blob)); return true; } catch(e){ return false; }
}
async function wipeSave(){
  memSave = null;
  try { if (window.storage) await window.storage.delete(KEY); } catch(e){}
  try { localStorage.removeItem(KEY); } catch(e){}
}

/* ============================================================================
   LE MONDE — Phaser 3
   Aucun asset : toutes les textures sont générées au lancement.
   Remplace makeTextures() par des vraies images IA quand tu les auras.
   ============================================================================ */

/* codes de tuile */
const V = { VOID:0, GROUND:1, ROCK:2, GAP:3, WATER:4, CRACK:5, SEAL:6, THRONE:7 };

/* quel verbe ouvre quel obstacle */
const OPENS = { [V.GAP]:'FONDRE', [V.WATER]:'ONDE', [V.CRACK]:'BRISE', [V.SEAL]:'AOUT' };

let MAP = [];            // MAP[y][x]
let ENTITIES = [];        // { id, tx, ty, type }

/* Index des tuiles dans tileset.png — même ordre que tools/gen_assets.py */
const TN = ['g0a','g0b','g1a','g1b','g2a','g2b','g3a','g3b',
            'g4a','g4b','g5a','g5b','throne','throne2','rock','rock_top',
            'gap','water','crack','seal','rubble','bone','salt_pile','post'];
const TF = Object.fromEntries(TN.map((n,i) => [n,i]));

/* chars.png : 8 persos x 3 frames sur 24 colonnes, 4 directions en lignes */
const CHAR_COLS = 24;
const CHAR_I = { jhn:0, petitnoir:1, libellule:2, maxime:3,
                 inqtroub:4, marquis:5, npc_off:6, npc_on:7 };
const DIR_ROW = { down:0, left:1, right:2, up:3 };
const charFrame = (who, dir, f) => DIR_ROW[dir]*CHAR_COLS + CHAR_I[who]*3 + f;

/* --------------------------------------------------------------------------
   Construction de la carte. Six régions en L, portes verrouillées par verbe.
   -------------------------------------------------------------------------- */
function buildMap(){
  MAP = Array.from({length:MAPH}, () => Array(MAPW).fill(V.VOID));

  const rect = r => ({ x0:r.gx*RW, y0:r.gy*RH, x1:r.gx*RW+RW-1, y1:r.gy*RH+RH-1 });

  // sol + murs de chaque région
  for (const r of REGIONS){
    const b = rect(r);
    for (let y=b.y0; y<=b.y1; y++)
      for (let x=b.x0; x<=b.x1; x++)
        MAP[y][x] = (x===b.x0||x===b.x1||y===b.y0||y===b.y1) ? V.ROCK : V.GROUND;
  }

  // reliefs dispersés — bruit déterministe, la carte est la même à chaque partie
  let seed = 20262020;
  const rnd = () => (seed = (seed*1664525 + 1013904223) % 4294967296) / 4294967296;
  for (const r of REGIONS){
    const b = rect(r);
    for (let i=0; i<26; i++){
      const x = b.x0+2 + Math.floor(rnd()*(RW-5));
      const y = b.y0+2 + Math.floor(rnd()*(RH-5));
      if (MAP[y][x] === V.GROUND) MAP[y][x] = V.ROCK;
    }
  }

  // dégagement garanti autour du point d'apparition
  for (let y=39; y<=43; y++) for (let x=7; x<=11; x++)
    if (MAP[y] && MAP[y][x] === V.ROCK) MAP[y][x] = V.GROUND;

  // salle du trône, dans Le Trône Vide
  const t = rect(REGIONS[0]);
  for (let y=t.y0+2; y<=t.y0+5; y++)
    for (let x=t.x0+2; x<=t.x0+7; x++) MAP[y][x] = V.THRONE;

  /* portes entre régions. door(a,b,type) perce le mur mitoyen. */
  function door(a, b, type){
    const A = rect(REGIONS[a]), B = rect(REGIONS[b]);
    if (REGIONS[a].gy === REGIONS[b].gy){
      const x = Math.max(A.x0, B.x0);           // mur vertical partagé
      const y = Math.floor((A.y0 + A.y1) / 2);
      for (const dy of [-1,0,1]) MAP[y+dy][x] = type;
      MAP[y][x-1] = MAP[y][x+1] = V.GROUND;
    } else {
      const y = Math.max(A.y0, B.y0);           // mur horizontal partagé
      const x = Math.floor((A.x0 + A.x1) / 2);
      for (const dx of [-1,0,1]) MAP[y][x+dx] = type;
      MAP[y-1][x] = MAP[y+1][x] = V.GROUND;
    }
  }
  door(0,1, V.GROUND);   // ouvert : la sortie du trône
  door(1,2, V.GAP);      // libellule marron glacé
  door(2,3, V.CRACK);    // gros maxime
  door(3,4, V.WATER);    // aqua
  door(4,5, V.SEAL);     // 11 août

  /* entités : chaque entrée du registre est posée dans sa région */
  ENTITIES = [];
  seed = 771113;
  for (const r of REGIONS){
    const b = rect(r);
    const list = ROSTER.filter(e => e.reg === r.i && e.kind !== 'king' && e.kind !== 'boss'
                                    && !BOSS_REWARDS.has(e.id));
    list.forEach((e, i) => {
      let x, y, tries = 0;
      do {
        x = b.x0+2 + Math.floor(rnd()*(RW-5));
        y = b.y0+2 + Math.floor(rnd()*(RH-5));
      } while (MAP[y][x] !== V.GROUND && ++tries < 60);
      MAP[y][x] = V.GROUND;
      ENTITIES.push({ id:e.id, tx:x, ty:y, type:'recruit' });
    });
  }
  // un boss par région, au fond de sa zone
  for (const def of Object.values(BOSSES)){
    const b = rect(REGIONS[def.reg]);
    let bx = b.x0 + (def.reg === 0 ? 4 : RW - 5);
    let by = b.y0 + Math.floor(RH/2);
    for (const [dx,dy] of [[0,0],[0,-1],[0,1],[-1,0],[1,0],[-2,0],[0,-2],[0,2]]){
      if (MAP[by+dy] && MAP[by+dy][bx+dx] !== V.ROCK && MAP[by+dy][bx+dx] !== V.VOID){
        bx += dx; by += dy; break;
      }
    }
    MAP[by][bx] = MAP[by][bx] === V.THRONE ? V.THRONE : V.GROUND;
    // dégagement autour de l'arène
    for (let y=by-1; y<=by+1; y++) for (let x=bx-1; x<=bx+1; x++)
      if (MAP[y] && MAP[y][x] === V.ROCK) MAP[y][x] = V.GROUND;
    ENTITIES.push({ id:def.id, tx:bx, ty:by, type:'boss' });
  }
}

function tileAtRaw(tx,ty){
  return (ty<0||ty>=MAPH||tx<0||tx>=MAPW) ? V.VOID : MAP[ty][tx];
}
function tileAt(tx,ty){
  if (ty<0||ty>=MAPH||tx<0||tx>=MAPW) return V.VOID;
  return MAP[ty][tx];
}
function blocked(tx,ty){
  const v = tileAt(tx,ty);
  if (v === V.VOID || v === V.ROCK) return true;
  const need = OPENS[v];
  if (need) return need === 'AOUT' ? !has('aout11') : !hasVerb(need);
  return false;
}
function regionAt(tx,ty){
  return REGIONS.find(r => tx>=r.gx*RW && tx<r.gx*RW+RW && ty>=r.gy*RH && ty<r.gy*RH+RH) || REGIONS[0];
}

/* ==========================================================================
   SCÈNE
   ========================================================================== */
class WorldScene extends Phaser.Scene {
  constructor(){ super({ key:'world', active:false }); }

  preload(){
    this.load.spritesheet('tiles',  ASSETS.tileset, { frameWidth:32, frameHeight:32 });
    this.load.spritesheet('chars',  ASSETS.chars,   { frameWidth:32, frameHeight:32 });
    this.load.spritesheet('bosses', ASSETS.bosses,  { frameWidth:64, frameHeight:64 });
  }

  create(){
    this.makeAnims();
    buildMap();
    this.drawGround();

    this.cameras.main.setBounds(0,0,MAPW*T,MAPH*T);
    this.cameras.main.setBackgroundColor(0x0E141C);

    // obstacles : un corps statique par tuile bloquante
    this.walls = this.physics.add.staticGroup();
    this.gateBodies = [];
    for (let y=0;y<MAPH;y++) for (let x=0;x<MAPW;x++){
      const v = MAP[y][x];
      if (v===V.ROCK || v===V.VOID || OPENS[v]){
        const b = this.walls.create(x*T+T/2, y*T+T/2, null).setVisible(false);
        b.body.setSize(T,T); b.tileV = v; b.tx = x; b.ty = y;
        if (OPENS[v]) this.gateBodies.push(b);
      }
    }

    // entités
    this.ents = [];
    for (const e of ENTITIES){
      const done = e.type === 'boss' ? S.bossesDone[e.id] : S.owned[e.id];
      if (done && e.type === 'boss') continue;
      let s;
      if (e.type === 'boss'){
        s = this.add.sprite(e.tx*T+T/2, e.ty*T+T/2, 'bosses').setDepth(5);
        s.play('boss_'+e.id);
      } else {
        const who = S.owned[e.id] ? 'npc_on' : 'npc_off';
        s = this.add.sprite(e.tx*T+T/2, e.ty*T+T/2, 'chars').setDepth(4);
        s.play(who+'_down');
        s.anims.msPerFrame = 260 + ((e.tx*53) % 220);
        this.tweens.add({ targets:s, y:s.y-2, duration:1500+((e.tx*37)%700),
          yoyo:true, repeat:-1, ease:'Sine.inOut' });
      }
      s.ent = e;
      this.ents.push(s);
    }

    // le roi
    this.p = this.physics.add.sprite(S.x*T+T/2, S.y*T+T/2, 'chars').setDepth(6);
    this.p.setFrame(charFrame('jhn','down',0));
    this.dir = 'down';
    this.p.body.setSize(16,14).setOffset(6,16);
    this.hintAt = 0;
    this.physics.add.collider(this.p, this.walls, (_p, w) => {
      if (!OPENS[w.tileV] || UI.busy) return;
      const now = this.time.now;
      if (now - this.hintAt < 2500) return;
      this.hintAt = now;
      UI.gateHint(w.tileV);
    });
    this.cameras.main.startFollow(this.p, true, 0.12, 0.12);
    this.cameras.main.setZoom(this.computeZoom());

    this.setupInput();
    this.refreshGates();
    this.near = null;
    this.scale.on('resize', () => this.cameras.main.setZoom(this.computeZoom()));
    UI.setRegion(regionAt(S.x, S.y));
  }

  computeZoom(){
    // ~11 tuiles visibles en largeur : lisible sur un écran de téléphone
    return Math.max(1.4, Math.min(3.2, this.scale.width / (11*T)));
  }

  /* -------- animations de marche, identiques pour tous les persos -------- */
  makeAnims(){
    for (const who of Object.keys(CHAR_I)){
      for (const dir of Object.keys(DIR_ROW)){
        const key = `${who}_${dir}`;
        if (this.anims.exists(key)) continue;
        this.anims.create({
          key,
          frames: [0,1,0,2].map(f => ({ key:'chars', frame:charFrame(who,dir,f) })),
          frameRate: 7, repeat: -1,
        });
      }
    }
    for (const [id, def] of Object.entries(BOSSES)){
      const key = `boss_${id}`;
      if (this.anims.exists(key)) continue;
      this.anims.create({
        key,
        frames: [0,1,2,3].map(f => ({ key:'bosses', frame:def.art*4 + f })),
        frameRate: 4, repeat: -1,
      });
    }
  }

  /* -------- rendu du sol dans une seule RenderTexture -------- */
  drawGround(){
    const rt = this.add.renderTexture(0,0,MAPW*T,MAPH*T).setOrigin(0).setDepth(0);
    const h = (x,y) => ((x*73856093) ^ (y*19349663)) >>> 0;   // hachage stable

    rt.beginDraw();
    for (let y=0;y<MAPH;y++) for (let x=0;x<MAPW;x++){
      const v = MAP[y][x];
      if (v === V.VOID) continue;
      let f;
      switch(v){
        case V.ROCK:   f = (tileAtRaw(x,y-1) !== V.ROCK) ? TF.rock_top : TF.rock; break;
        case V.THRONE: f = (h(x,y) % 7 === 0) ? TF.throne2 : TF.throne; break;
        case V.GAP:    f = TF.gap;   break;
        case V.WATER:  f = TF.water; break;
        case V.CRACK:  f = TF.crack; break;
        case V.SEAL:   f = TF.seal;  break;
        default: {
          const r = regionAt(x,y).i;
          const n = h(x,y) % 100;
          if      (n === 3)  f = TF.rubble;
          else if (n === 17) f = TF.bone;
          else if (n === 41) f = TF.salt_pile;
          else if (n === 63) f = TF.post;
          else f = TF['g'+r+(n % 2 ? 'a' : 'b')];
        }
      }
      rt.batchDrawFrame('tiles', f, x*T, y*T);
    }
    rt.endDraw();
  }

  /* -------- entrées tactiles : joystick à gauche, action à droite -------- */
  setupInput(){
    this.keys = this.input.keyboard
      ? this.input.keyboard.addKeys({ up:'W', down:'S', left:'A', right:'D',
          up2:'UP', down2:'DOWN', left2:'LEFT', right2:'RIGHT' })
      : null;
    if (this.input.keyboard)
      this.input.keyboard.on('keydown-SPACE', () => this.interact());

    $('#actBtn').onclick = () => this.interact();
    bindTouch();                      // une seule fois pour toute la session
  }

  /* -------- ouvre les obstacles dont le verbe est acquis -------- */
  refreshGates(){
    for (const b of this.gateBodies){
      if (!b.body) continue;
      const need = OPENS[b.tileV];
      const open = need === 'AOUT' ? has('aout11') : hasVerb(need);
      b.body.enable = !open;
    }
  }

  interact(){
    if (!this.near || UI.busy) return;
    const e = this.near.ent;
    UI.busy = true;
    if (e.type === 'boss') Combat.start(BOSSES[e.id], this.near);
    else UI.recruit(e, this.near);
  }

  update(){
    if (UI.busy){ this.p.setVelocity(0,0); MOVE.x = MOVE.y = 0; return; }

    let vx = MOVE.x, vy = MOVE.y;
    if (this.keys){
      if (this.keys.left.isDown  || this.keys.left2.isDown)  vx = -1;
      if (this.keys.right.isDown || this.keys.right2.isDown) vx =  1;
      if (this.keys.up.isDown    || this.keys.up2.isDown)    vy = -1;
      if (this.keys.down.isDown  || this.keys.down2.isDown)  vy =  1;
    }
    const SPD = 122;
    this.p.setVelocity(vx*SPD, vy*SPD);

    if (vx || vy){
      const dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 'left' : 'right')
                                              : (vy < 0 ? 'up'   : 'down');
      if (dir !== this.dir || !this.p.anims.isPlaying){
        this.dir = dir;
        this.p.play('jhn_'+dir, true);
      }
    } else if (this.p.anims.isPlaying){
      this.p.stop();
      this.p.setFrame(charFrame('jhn', this.dir, 0));
    }

    // région courante
    const tx = Math.floor(this.p.x/T), ty = Math.floor(this.p.y/T);
    if (tx !== S.x || ty !== S.y){
      const before = regionAt(S.x, S.y);
      S.x = tx; S.y = ty;
      const now = regionAt(tx,ty);
      if (now !== before) UI.setRegion(now);
    }

    // entité la plus proche
    let best = null, bd = 46;
    for (const s of this.ents){
      if (!s.active) continue;
      const d = Phaser.Math.Distance.Between(this.p.x,this.p.y,s.x,s.y);
      if (d < bd){ bd = d; best = s; }
    }
    if (best !== this.near){
      this.near = best;
      const btn = $('#actBtn');
      btn.classList.toggle('on', !!best);
      if (best) btn.textContent = best.ent.type === 'boss' ? 'AFFRONTER' : 'PARLER';
    }
  }
}


/* --------------------------------------------------------------------------
   Joystick virtuel — lié une seule fois, indépendant de la scène.
   Moitié gauche de l'écran : on pose le doigt, le stick apparaît là.
   -------------------------------------------------------------------------- */
const MOVE = { x:0, y:0 };
let touchBound = false;

function bindTouch(){
  if (touchBound) return;
  touchBound = true;

  const stick = $('#stick'), knob = stick.firstElementChild;
  let id = null, ox = 0, oy = 0;

  const start = ev => {
    if (UI.busy || id !== null) return;
    const t = ev.changedTouches ? ev.changedTouches[0] : ev;
    if (t.clientX > innerWidth * 0.55) return;
    id = t.identifier !== undefined ? t.identifier : 'mouse';
    ox = t.clientX; oy = t.clientY;
    stick.style.display = 'block';
    stick.style.left = (ox - 56) + 'px';
    stick.style.top  = (oy - 56) + 'px';
  };
  const move = ev => {
    if (id === null) return;
    const list = ev.changedTouches ? [...ev.changedTouches] : [ev];
    const t = list.find(t => (t.identifier !== undefined ? t.identifier : 'mouse') === id);
    if (!t) return;
    let dx = t.clientX - ox, dy = t.clientY - oy;
    const d = Math.hypot(dx, dy) || 1, m = Math.min(d, 46);
    dx = dx / d * m; dy = dy / d * m;
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    MOVE.x = dx / 46; MOVE.y = dy / 46;
    if (ev.cancelable) ev.preventDefault();
  };
  const end = () => {
    id = null; MOVE.x = MOVE.y = 0;
    stick.style.display = 'none';
    knob.style.transform = '';
  };

  addEventListener('touchstart', start, { passive:true });
  addEventListener('touchmove',  move,  { passive:false });
  addEventListener('touchend',   end);
  addEventListener('touchcancel',end);
  addEventListener('mousedown',  start);
  addEventListener('mousemove',  move);
  addEventListener('mouseup',    end);
}


/* ============================================================================
   LE COMBAT
   Chaque personnage a son tour, annoncé d'avance dans la file.
   Mais JHN n'a que deux sceaux : quand le tour d'un allié arrive, il faut
   encore pouvoir le payer. Trois alliés, deux ordres — l'un des trois
   regarde passer son tour. C'est cette rareté qui remplace les types.
   ============================================================================ */

const ALLY_KIT = {
  petitnoir: { hp:28, spd:5, verbs:['FRAPPE','GARDE','CHANTE'] },
  libellule: { hp:24, spd:9, verbs:['FRAPPE','GARDE','FONDRE'] },
  maxime:    { hp:42, spd:3, verbs:['FRAPPE','GARDE','BRISE']  },
  inqtroub:  { hp:26, spd:6, verbs:['FRAPPE','GARDE','REVELE'] },
  marquis:   { hp:22, spd:7, verbs:['FRAPPE','GARDE','DECRET'] },
};
const BOSS_REWARDS = new Set(Object.values(BOSSES).map(b => b.reward).filter(Boolean));

/* vitesse de chaque ennemi : décide de sa place dans la file */
const BOSS_SPD = { rire:4, blague:5, saumure:2, puits:2, maree:5, won:6 };

const Combat = {
  on:false, boss:null, def:null, sprite:null,
  allies:[], seals:0, sel:0, mark:0, pending:null, pIdx:0,
  queue:[], qi:0, locked:true, round:0,

  maxSeals(){
    const alive = this.allies.filter(a => a.hp > 0).length || 1;
    return Math.min(2 + (has('darius') ? 1 : 0), alive);
  },
  allyMaxHp(id){ return ALLY_KIT[id].hp + (S.level - 1) * 3; },
  minCost(a){ return Math.min.apply(null, a.verbs.map(v => VERBS[v].cost)); },

  /* ---------------------------------------------------------------- départ */
  start(def, sprite){
    const roster = party();
    if (!roster.length){
      UI.say('JHN', "Personne ne répond. Il faut d'abord quelqu'un à commander.");
      return;
    }
    this.def = def; this.sprite = sprite; this.on = true;
    this.boss = { hp:def.hp, max:def.hp, guard:false };
    this.allies = roster.slice(0,3).map(e => ({
      id:e.id, name:e.name,
      hp:this.allyMaxHp(e.id), max:this.allyMaxHp(e.id),
      spd:ALLY_KIT[e.id].spd, guard:false, threat:0, used:{},
      verbs:ALLY_KIT[e.id].verbs,
    }));
    this.mark = 0; this.pending = null; this.pIdx = 0; this.round = 0;

    UI.busy = true;
    $('#log').innerHTML = '';
    $('#fx').innerHTML = '';
    $('#foeName').textContent = def.name;
    const art = $('#foeArt');
    art.style.backgroundImage = `url(${ASSETS.bosses})`;
    art.style.backgroundPositionY = `-${def.art * 150}px`;
    show('#combat', true);
    this.log(def.intro);
    this.buildField();
    this.newRound();
    this.step();
  },

  log(t){
    const p = document.createElement('p');
    p.textContent = t;
    const box = $('#log');
    box.appendChild(p);
    while (box.children.length > 3) box.firstChild.remove();
  },

  /* =======================================================================
     LE TERRAIN — alliés de dos, ennemi de face. Cadrage Pokémon.
     ======================================================================= */
  buildField(){
    const row = $('#allyRow');
    row.innerHTML = '';
    this.allies.forEach((a, i) => {
      const u = document.createElement('div');
      u.className = 'unit';
      u.dataset.i = i;
      const col = CHAR_I[a.id] * 3, r = DIR_ROW.up;   // vue de dos
      u.innerHTML = `<div class="sp" style="background-image:url(${ASSETS.chars});
          background-position:-${col*88}px -${r*88}px"></div>
        <div class="un">${a.name}</div>
        <div class="bar small"><i></i></div>
        <div class="uh"></div>`;
      row.appendChild(u);
      a.el = u;
    });
  },

  /* ------------------------------------------------- effets visuels courts */
  anim(el, cls, ms){
    if (!el || !el.classList) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), ms || 380);
  },

  centerOf(el){
    const fx = $('#fx');
    if (!el || !el.getBoundingClientRect || !fx || !fx.getBoundingClientRect) return { x:0, y:0 };
    const a = el.getBoundingClientRect(), b = fx.getBoundingClientRect();
    return { x: a.left - b.left + a.width/2, y: a.top - b.top + a.height/2 };
  },

  popNumber(el, text, kind){
    const fx = $('#fx');
    if (!fx || !fx.appendChild) return;
    const c = this.centerOf(el);
    const d = document.createElement('div');
    d.className = 'dmg ' + kind;
    d.textContent = text;
    d.style.left = c.x + 'px';
    d.style.top  = c.y + 'px';
    fx.appendChild(d);
    setTimeout(() => d.remove && d.remove(), 1000);
  },

  ringAt(el){
    const fx = $('#fx');
    if (!fx || !fx.appendChild) return;
    const c = this.centerOf(el);
    const r = document.createElement('div');
    r.className = 'ring';
    r.style.left = c.x + 'px';
    r.style.top  = c.y + 'px';
    fx.appendChild(r);
    setTimeout(() => r.remove && r.remove(), 460);
  },

  shakeField(){
    const f = $('#field');
    if (f && f.animate) f.animate(
      [{transform:'translate(0,0)'},{transform:'translate(-6px,3px)'},
       {transform:'translate(5px,-2px)'},{transform:'translate(0,0)'}], { duration:220 });
  },

  /* =======================================================================
     LA FILE — un tour par personnage, ennemi inclus, trié par vitesse.
     ======================================================================= */
  newRound(){
    this.round++;
    this.seals = this.maxSeals();
    for (const a of this.allies){ a.threat = 0; a.spent = false; }
    const actors = this.allies.filter(a => a.hp > 0)
      .map(a => ({ type:'ally', id:a.id, spd:a.spd }));
    actors.push({ type:'foe', spd: BOSS_SPD[this.def.id] || 5 });
    actors.sort((x, y) => y.spd - x.spd);
    this.queue = actors;
    this.qi = 0;
  },

  async step(){
    if (this.boss.hp <= 0) return this.win();
    if (this.allies.every(a => a.hp <= 0)) return this.lose();

    if (this.qi >= this.queue.length){
      this.newRound();
      this.render();
      await wait(260);
      return this.step();
    }

    const slot = this.queue[this.qi];

    if (slot.type === 'foe'){
      this.locked = true;
      this.render();
      await wait(420);
      await this.foeTurn();
      this.qi++;
      if (this.allies.every(a => a.hp <= 0)) return this.lose();
      await wait(260);
      return this.step();
    }

    const i = this.allies.findIndex(a => a.id === slot.id);
    const a = this.allies[i];
    if (!a || a.hp <= 0){ this.qi++; return this.step(); }

    this.sel = i;
    a.guard = false;              // la garde posee au tour precedent retombe ici

    if (this.seals < this.minCost(a)){
      this.locked = true;
      this.render();
      this.log(`${a.name} attend un ordre qui ne vient pas.`);
      a.spent = true;
      await wait(760);
      this.qi++;
      return this.step();
    }

    this.locked = false;
    this.render();
  },

  /* --------------------------------------------------------- rendu complet */
  render(){
    const seals = $('#seals');
    seals.innerHTML = '';
    for (let i = 0; i < this.maxSeals(); i++){
      const d = document.createElement('div');
      d.className = 'seal' + (i >= this.seals ? ' spent' : '');
      seals.appendChild(d);
    }

    $('#foeHp').style.width = Math.max(0, this.boss.hp / this.boss.max * 100) + '%';

    const tele = $('#tele'), seen = has('joker');
    tele.classList.toggle('hidden', !seen);
    const art = $('#foeArt');
    if (this.pending){
      $('#teleAct').textContent = this.pending.act;
      const imp = this.pending.unblockable ? ' · IMPARABLE' : '';
      $('#teleCnt').textContent = (this.pending.left > 0
        ? `RÉSOUT DANS ${this.pending.left}` : 'MAINTENANT') + imp;
      tele.classList.toggle('imminent', this.pending.left <= 1);
      if (art && art.classList) art.classList.add('anim-wind');
    } else {
      $('#teleAct').textContent = this.boss.guard ? 'En garde' : 'Immobile';
      $('#teleCnt').textContent = '';
      tele.classList.remove('imminent');
      if (art && art.classList) art.classList.remove('anim-wind');
    }
    if (!seen) $('#teleAct').textContent = 'Illisible';

    this.allies.forEach((a, i) => {
      if (!a.el || !a.el.classList) return;
      a.el.classList.toggle('ko', a.hp <= 0);
      a.el.classList.toggle('guarding', a.guard && a.hp > 0);
      a.el.classList.toggle('active', !this.locked && i === this.sel && a.hp > 0);
      const bar = a.el.querySelector('.bar > i');
      if (bar) bar.style.width = Math.max(0, a.hp / a.max * 100) + '%';
      const hp = a.el.querySelector('.uh');
      if (hp) hp.textContent = `${Math.max(0, a.hp)}/${a.max}`;
    });

    this.renderTurnbar();

    const vr = $('#verbRow');
    vr.innerHTML = '';
    const cur = this.allies[this.sel];
    if (!this.locked && cur && cur.hp > 0){
      for (const key of cur.verbs){
        const v = VERBS[key];
        const spent = v.once && cur.used[key];
        const b = document.createElement('button');
        b.className = 'verb';
        b.innerHTML = `${v.label}<span class="cost">${'●'.repeat(v.cost)}</span>`;
        b.disabled = spent || this.seals < v.cost;
        b.onclick = () => this.act(key);
        vr.appendChild(b);
      }
    }

    $('#cbtPhase').textContent = this.locked
      ? `MANCHE ${this.round}`
      : `AU TOUR DE ${(cur ? cur.name : '').toUpperCase()}`;
    $('#endturn').disabled = this.locked;
    $('#endturn').textContent = (cur && !this.locked) ? `Faire passer ${cur.name}` : 'Passer';
  },

  renderTurnbar(){
    const bar = $('#turnbar');
    if (!bar || !bar.appendChild) return;
    bar.innerHTML = '';
    this.queue.forEach((slot, i) => {
      const d = document.createElement('div');
      const past = i < this.qi;
      if (slot.type === 'foe'){
        d.className = 'slot foe' + (i === this.qi ? ' now' : '') + (past ? ' spent' : '');
        d.innerHTML = `<div class="f" style="background-image:url(${ASSETS.bosses});
          background-position:0 -${this.def.art * 38}px"></div>`;
      } else {
        const a = this.allies.find(x => x.id === slot.id);
        const dead = !a || a.hp <= 0;
        d.className = 'slot' + (i === this.qi ? ' now' : '')
                    + (past ? ' spent' : '') + (dead ? ' dead' : '');
        const col = CHAR_I[slot.id] * 3;
        d.innerHTML = `<div class="f" style="background-image:url(${ASSETS.chars});
          background-position:-${col*38}px 0"></div>`;
      }
      bar.appendChild(d);
    });
  },

  /* ================================================================= ORDRES */
  act(key){
    if (this.locked) return;
    const v = VERBS[key], a = this.allies[this.sel];
    if (!a || a.hp <= 0) return;
    if (this.seals < v.cost || (v.once && a.used[key])) return;

    this.locked = true;
    this.seals -= v.cost;
    if (v.once) a.used[key] = true;

    if (v.guard){ a.guard = true; this.log(`${a.name} se place devant.`); }
    if (v.refund){ this.seals += v.refund; this.log(`${a.name} décrète. Deux sceaux reviennent.`); }
    if (v.mark){ this.mark = v.mark; this.log(`${a.name} désigne le point faible.`); }

    if (v.breaks){
      if (this.pending){ this.log(`${a.name} brise la préparation. L'attaque tombe.`); this.pending = null; }
      else if (this.boss.guard){ this.log(`${a.name} ouvre la garde.`); this.boss.guard = false; }
    }

    let dealt = 0;
    if (v.dmg){
      let d = v.dmg;
      if (this.mark > 0) d = Math.round(d * 1.6);
      if (this.boss.guard && !v.pierce) d = Math.round(d * 0.5);
      this.boss.hp -= d;
      a.threat += d;
      dealt = d;
      this.log(`${a.name} — ${v.label.toLowerCase()} · ${d} dégâts.`);
    }

    let healed = 0;
    if (v.heal){
      for (const x of this.allies) if (x.hp > 0) x.hp = Math.min(x.max, x.hp + v.heal);
      healed = v.heal;
      this.log('Le chant referme les plaies.');
    }

    if (v.selfKO){ a.hp = 0; this.log(`${a.name} ne se relèvera pas de ce combat.`); }

    a.spent = true;
    this.afterAct(a, v, dealt, healed);
  },

  /* animations puis tour suivant — le simulateur neutralise cette méthode */
  async afterAct(a, v, dealt, healed){
    const foe = $('#foeArt');
    if (dealt > 0){
      this.anim(a.el, 'anim-lunge', 360);
      await wait(150);
      this.anim(foe, 'anim-foehit', 320);
      this.ringAt(foe);
      this.popNumber(foe, dealt, 'foe');
      if (dealt >= 18) this.shakeField();
    } else if (healed > 0){
      for (const x of this.allies) if (x.hp > 0){
        this.anim(x.el, 'anim-heal', 620);
        this.popNumber(x.el, '+' + healed, 'heal');
      }
    } else {
      this.anim(a.el, 'anim-lunge', 320);
      if (!v.guard) this.ringAt(foe);
    }

    this.render();
    await wait(430);
    this.qi++;
    this.step();
  },

  passTurn(){
    if (this.locked) return;
    const a = this.allies[this.sel];
    this.locked = true;
    if (a){ a.spent = true; this.log(`${a.name} ne reçoit pas d'ordre.`); }
    this.render();
    setTimeout(() => { this.qi++; this.step(); }, 380);
  },

  /* ================================================================= ENNEMI */
  async foeTurn(){
    if (this.mark > 0) this.mark--;

    if (this.pending){
      this.pending.left--;
      if (this.pending.left <= 0){
        const p = this.pending; this.pending = null; this.boss.guard = false;
        await this.resolve(p);
      } else {
        this.log(`${this.def.name} continue de se préparer.`);
      }
    } else {
      const st = this.def.pattern[this.pIdx % this.def.pattern.length];
      this.pIdx++;
      this.boss.guard = !!st.guard;
      if (st.wind > 0){
        this.pending = { ...st, left:st.wind };
        this.log(`${this.def.name} : ${st.act.toLowerCase()}…`);
        this.anim($('#foeArt'), 'anim-slam', 380);
      } else {
        await this.resolve(st);
      }
    }
    this.render();
  },

  async resolve(step){
    const foe = $('#foeArt');
    if (!step.dmg){
      this.log(`${this.def.name} ${step.act.toLowerCase()}.`);
      this.anim(foe, 'anim-slam', 380);
      await wait(300);
      return;
    }

    const alive = this.allies.filter(a => a.hp > 0);
    if (!alive.length) return;

    /* Une attaque imparable traverse la garde : seule une brisure l'arrête. */
    const guard = step.unblockable ? null : alive.find(a => a.guard);
    /* Sinon le boss frappe celui qui vient de le frapper le plus fort :
       attaquer, c'est se désigner. */
    const target = guard || alive.reduce((m, a) =>
      (a.threat > m.threat || (a.threat === m.threat && a.hp > m.hp)) ? a : m, alive[0]);

    let d = step.dmg;
    if (guard) d = Math.round(d * 0.4);
    if (step.unblockable) this.log('Rien ne peut être placé devant.');

    this.anim(foe, 'anim-slam', 400);
    await wait(190);

    target.hp -= d;
    this.anim(target.el, 'anim-hit', 360);
    this.ringAt(target.el);
    this.popNumber(target.el, d, 'ally');
    this.shakeField();
    this.log(`${step.act} — ${target.name} encaisse ${d}${guard ? ' (garde)' : ''}.`);
    if (target.hp <= 0) this.log(`${target.name} ne répond plus.`);
    await wait(380);
  },

  /* =============================================================== RÉSULTATS */
  async win(){
    this.locked = true;
    this.render();
    this.log(this.def.outro);
    const foe = $('#foeArt');
    if (foe && foe.animate) foe.animate(
      [{opacity:1, transform:'scale(1)'},{opacity:0, transform:'scale(1.35) rotate(8deg)'}],
      { duration:900, fill:'forwards' });
    await wait(1600);

    S.bossesDone[this.def.id] = true;
    S.level++;
    let gained = null;
    if (await grant(this.def.reward)) gained = BY_ID[this.def.reward];
    await saveGame();
    this.close();
    if (this.sprite) this.sprite.destroy();
    await wait(260);
    if (gained) UI.say('LE SALÉ LINGUISTIQUE',
      `${gained.name} rejoint le royaume. ${UI.verbLine(gained)}`);
    else UI.say('LE ROI', `Niveau ${S.level}. Les tiens tiennent un peu mieux debout.`);
  },

  async lose(){
    this.locked = true;
    this.log('Plus personne ne se lève. JHN recule.');
    this.render();
    await wait(1600);
    this.close();
    UI.say('JHN', "Ce n'était pas le bon ordre. Recommence.");
  },

  close(){
    this.on = false;
    show('#combat', false);
    UI.busy = false;
  },
};


/* ============================================================================
   INTERFACE — dialogue, recrutement, royaume, registre.
   ============================================================================ */

/* Les répliques du peuplement.
   ⚠️ À REMPLACER : ce sont des lignes neutres. Les vraies vannes, c'est toi.
   Une entrée du ROSTER peut recevoir sa propre ligne dans LINES ci-dessous. */
/*  Une réplique par entrée. Elles sont écrites pour tenir sans connaître
    la vanne d'origine : chacune parle du royaume, du sel, ou du fait
    d'être retrouvé. Remplace librement — la structure ne bouge pas. */
const LINES = {
  // 2020 — 2022
  petitnoir: "Je ne sais pas me battre. Je sais chanter pendant que les autres tombent.",
  joker:     "Méfie-toi de tout. Surtout de ce qui prend son temps avant de frapper.",
  felic:     "Bravo. Sincèrement. Tu es le premier à revenir jusqu'ici.",
  // 2023
  blague:    "On m'a dit que ce royaume était une plaisanterie. J'ai attendu la chute. Elle n'est jamais venue.",
  oris:      "J'étais là avant le sel. Je serai là après.",
  libellule: "Les gouffres, ça se survole. Les gardes, ça se contourne.",
  daniel:    "Je ne pose pas de questions. Montre-moi où marcher.",
  muri:      "Les murs sont tombés. Moi je tiens encore.",
  lee:       "Court. Net. Je viens.",
  // 2024
  qui:       "Qui ? Toi ? … D'accord. Alors allons-y.",
  tressale:  "Ce qui a détruit ce royaume, j'en ai gardé le goût.",
  quoimg:    "Tu me regardes comment, là ? … Non, c'est bon. Je te suis.",
  maxime:    "Montre-moi ce qui est fermé.",
  uuh:       "…UUUUHHHH. Voilà. C'est tout ce que j'ai à dire.",
  aqua:      "L'eau ne t'arrêtera plus.",
  darius:    "Un ordre de plus par tour. Utilise-le mieux que le premier.",
  youpi:     "Enfin quelqu'un. J'allais finir par parler tout seul.",
  inquis:    "J'ai jugé tout le monde ici. Il ne reste personne. Alors je te suis.",
  inqtroub:  "Nous sommes deux, nous prenons une place. Nous la valons.",
  milf:      "Trente-cinq à retrouver et tu commences par moi. Bon choix.",
  mystic:    "Bois. Ou ne bois pas. Mais avance.",
  aout11:    "Tu sais ce que cette date ouvre. Monte.",
  // 2025
  trisse:    "J'ai ri quand tout est tombé. C'était ça ou pleurer.",
  la:        "Là. N'importe où, en fait.",
  celeb:     "Quand ils seront tous revenus, on fera quelque chose. Promets-le.",
  gluter:    "Je colle. Aux murs, aux gens, au royaume. Je ne pars pas.",
  ilfaut:    "Il faut. C'est tout. Il faut, donc j'y vais.",
  marquis:   "Un décret ne coûte rien. Il rend même du temps.",
  bipo:      "Un jour je tiens tout le royaume. Le lendemain rien. Aujourd'hui : tout.",
  jhahan:    "JHHAHAHHAHAHAN. …Désolé. C'est nerveux. Depuis le sel.",
  taff:      "Il y a du travail. Beaucoup. Commence par me suivre.",
  cuba:      "Le meilleur d'entre nous, paraît-il. On verra.",
  // 2026
  memoire:   "Ce tour-là, tu peux le rejouer. Une fois.",
  selfkill:  "Il y aura un moment où ça vaudra le coup. Un seul.",
};
const FILLER = ["Je te suis."];

const UI = {
  busy:false, scene:null, _resolve:null,

  /* ------------------------------------------------------------- dialogue */
  say(who, text){
    return new Promise(res => {
      this.busy = true;
      $('#dWho').textContent = who;
      $('#dTxt').textContent = text;
      show('#dialog', true);
      this._resolve = res;
    });
  },
  closeSay(){
    if (!$('#dialog').classList.contains('on')) return;
    show('#dialog', false);
    this.busy = false;
    const r = this._resolve; this._resolve = null;
    if (r) r();
  },

  /* --------------------------------------------------- ce qu'un allié ouvre */
  verbLine(e){
    if (!e.verb) return '';
    const map = {
      CHANTE:'Il chante en combat : dégâts légers, soin de groupe.',
      VOIT:'Tu lis désormais ce que prépare l\'ennemi.',
      FONDRE:'Elle ignore les gardes — et tu franchis les gouffres.',
      BRISE:'Il annule les charges — et ouvre les roches fendues.',
      ONDE:'Tu traverses l\'eau.',
      SCEAU:'Un sceau de plus à chaque tour.',
      REVELE:'Ils désignent le point faible : dégâts +60 % pendant deux tours.',
      DECRET:'Il rend deux sceaux, une fois par combat.',
      AILLEURS:'Tu peux revenir au royaume à volonté.',
      MEMOIRE:'Tu peux rejouer un tour.',
      SACRIFICE:'Un coup énorme. L\'allié tombe avec.',
    };
    return map[e.verb] || '';
  },

  /* ----------------------------------------------------------- recrutement */
  async recruit(e, sprite){
    const entry = BY_ID[e.id];
    if (S.owned[e.id]){
      await this.say(entry.name.toUpperCase(), 'Je te suis déjà.');
      return;
    }
    const line = LINES[e.id] || FILLER[0];
    await this.say(entry.name.toUpperCase(), line);

    await grant(e.id);
    sprite.play('npc_on_down');

    const extra = this.verbLine(entry);
    const n = ownedCount();
    await this.say('LE SALÉ LINGUISTIQUE',
      `${entry.name} — récupéré. ${n} / 35.${extra ? ' ' + extra : ''}`);
  },

  /* --------------------------------------------------------------- région */
  setRegion(r){
    $('#hudRegion').textContent = r.name;
    $('#hudYear').textContent = r.year;
  },

  /* --------------------------------------------------- obstacle verrouillé */
  gateHint(v){
    const need = OPENS[v];
    const txt = {
      FONDRE:'Un gouffre. Il faudrait quelqu\'un qui vole.',
      BRISE:'La roche est fendue mais tient. Il faudrait de la force.',
      ONDE:'L\'eau est haute. Il faudrait pouvoir la traverser.',
      AOUT:'Un sceau. Il porte une date que tu n\'as pas encore retrouvée.',
    }[need];
    if (txt) this.say('—', txt);
  },

  /* --------------------------------------------------------------- menu */
  openMenu(tab){
    this.busy = true;
    show('#menu', true);
    $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
    const sheet = $('#menuSheet');

    if (tab === 'realm'){
      const n = ownedCount();
      sheet.innerHTML = `
        <div class="sect">
          <div class="eyebrow">LE ROYAUME PERDU</div>
          <div class="decree" style="margin:8px 0 6px">${n} <span style="color:var(--salt-dim);font-size:.5em">/ 35</span></div>
          <p style="font-size:13px;color:var(--salt-dim);line-height:1.5">
            Chaque entrée retrouvée rallume un bâtiment. Niveau ${S.level} ·
            ${2 + (has('darius')?1:0)} sceaux par tour.</p>
        </div>
        <div class="sect" id="teamSect"></div>
        <div class="sect"><h3>Bâtiments</h3><div id="realm"></div></div>`;
      this.renderTeam();
      const grid = $('#realm');
      ROSTER.filter(e => e.kind !== 'king' && e.kind !== 'boss').forEach(e => {
        const d = document.createElement('div');
        d.className = 'brick' + (S.owned[e.id] ? ' up' : '');
        d.textContent = S.owned[e.id] ? e.name.slice(0,14) : '';
        grid.appendChild(d);
      });
    }

    if (tab === 'reg'){
      let html = '';
      let n = 0;
      for (const y of [2020,2021,2022,2023,2024,2025,2026]){
        const list = ROSTER.filter(e => e.y === y);
        html += `<div class="sect"><h3>${y}</h3>`;
        for (const e of list){
          n++;
          const own = S.owned[e.id] || e.kind === 'king';
          const kind = e.kind === 'play' ? '<span class="k play">jouable</span>'
                    : e.kind === 'equip' ? '<span class="k equip">objet</span>'
                    : e.kind === 'key'   ? '<span class="k key">clé</span>'
                    : e.kind === 'king'  ? '<span class="k key">roi</span>'
                    : e.kind === 'boss'  ? '<span class="k key">?</span>' : '';
          html += `<div class="entry${own?'':' locked'}">
            <span class="n">${String(n).padStart(2,'0')}</span>
            <span class="t">${own ? e.name : '—'}</span>${own ? kind : ''}</div>`;
        }
        html += '</div>';
      }
      sheet.innerHTML = html;
    }

    if (tab === 'sys'){
      sheet.innerHTML = `
        <div class="sect">
          <h3>Sauvegarde</h3>
          <p style="font-size:13px;color:var(--salt-dim);line-height:1.6">
            La partie s'enregistre automatiquement à chaque recrutement et à chaque
            boss vaincu. Ajoute la page à ton écran d'accueil pour y jouer en plein
            écran, hors ligne.</p>
          <button class="big warn" id="btnWipe">Effacer la sauvegarde</button>
        </div>`;
      $('#btnWipe').onclick = async () => {
        await wipeSave();
        location.reload();
      };
    }

    sheet.scrollTop = 0;
  },

  /* Trois places sur le terrain, cinq verbes possibles.
     C'est ici que se fait le vrai choix tactique. */
  renderTeam(){
    const host = $('#teamSect');
    if (!host) return;
    const own = playable();
    if (!own.length){ host.innerHTML = ''; return; }
    party();                                     // normalise S.team
    host.innerHTML = `<h3>Équipe · ${S.team.length} / 3</h3>`;
    for (const e of own){
      const inTeam = S.team.includes(e.id);
      const b = document.createElement('button');
      b.className = 'pick' + (inTeam ? ' in' : '');
      const col = CHAR_I[e.id] * 3, row = DIR_ROW.down;
      b.innerHTML = `<div class="av" style="background-image:url(${ASSETS.chars});
          background-position:-${col*44}px -${row*44}px"></div>
        <div><div class="who">${e.name}</div>
        <div class="vb">${VERBS[e.verb] ? VERBS[e.verb].label.toUpperCase() : ''}</div></div>
        <div class="slot">${inTeam ? 'SUR LE TERRAIN' : 'AU ROYAUME'}</div>`;
      b.onclick = async () => { toggleTeam(e.id); await saveGame(); this.renderTeam(); };
      host.appendChild(b);
    }
  },

  closeMenu(){ show('#menu', false); this.busy = false; },
};

/* ============================================================================
   AMORÇAGE
   ============================================================================ */
(async function boot(){
  const msg = $('#bootMsg');

  if (typeof Phaser === 'undefined'){
    msg.innerHTML = 'Phaser n\'a pas pu être chargé.<br>Vérifie ta connexion et recharge.';
    return;
  }

  const found = await loadGame();
  if (found && S.started) $('#btnCont').style.display = 'block';

  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor: '#0E141C',
    pixelArt: true,
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default: 'arcade', arcade: { gravity:{y:0}, debug:false } },
    scene: [WorldScene],
    audio: { noAudio: true },
  });

  const launch = async (fresh) => {
    if (fresh){
      Object.assign(S, {
        started:true, region:0, x:REGIONS[0].gx*RW+9, y:REGIONS[0].gy*RH+9,
        owned:{ jhn:true }, bossesDone:{}, level:1, flags:{},
      });
      await saveGame();
    }
    await fadeTo(async () => {
      show('#title', false);
      const sc = game.scene.getScene('world');
      if (sc && sc.scene.isActive()) sc.scene.restart(); else game.scene.start('world');
      await wait(140);
      UI.scene = game.scene.getScene('world');
    });
    if (fresh){
      await UI.say('JHN',
        "Il ne reste rien. Ni mur, ni garde, ni voix pour répondre. " +
        "Trente-cinq sont partis. Je n'ai plus que des ordres à donner.");
    }
  };

  $('#btnPlay').onclick = () => launch(true);
  $('#btnCont').onclick = () => launch(false);

  // dialogue : toucher n'importe où pour continuer
  $('#dialog').addEventListener('pointerdown', e => { e.stopPropagation(); UI.closeSay(); });

  // menu
  $('#menuBtn').onclick = () => UI.openMenu('realm');
  $$('.tab[data-tab]').forEach(t => t.onclick = () => UI.openMenu(t.dataset.tab));
  $('#closeMenu').onclick = () => UI.closeMenu();
  addEventListener('keydown', e => {
    if (e.key === 'Escape'){ UI.closeSay(); UI.closeMenu(); }
  });
  $('#menu').addEventListener('pointerdown', e => {
    if (e.target.id === 'menu') UI.closeMenu();
  });

  // combat
  $('#endturn').onclick = () => Combat.passTurn();

  $('#boot').style.display = 'none';
})();

</script>

</html>
